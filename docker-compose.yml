name: camisetas360-local

x-rabbitmq-environment: &rabbitmq-environment
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-camisetas360}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-camisetas360_dev}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/camisetas360}

x-resource-server-environment: &resource-server-environment
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${ENTRA_ISSUER_URI:-https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: ${ENTRA_AUDIENCE:-719c999d-0f57-4ad5-9bd9-a72be5ca07e0}

x-mail-environment: &mail-environment
  MAIL_USERNAME: ${MAIL_USERNAME:-local}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-local}
  MAIL_FROM: ${MAIL_FROM:-orders@camisetas360.test}

services:

  # ============================================================
  # BASES DE DATOS (POSTGRESQL 17 AISLADAS POR SERVICIO)
  # ============================================================

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - database-network

  catalog-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:?Define CATALOG_POSTGRES_DB}
      POSTGRES_USER: ${CATALOG_POSTGRES_USER:?Define CATALOG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD:?Define CATALOG_POSTGRES_PASSWORD}
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - catalog-database-network

  auth-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?Define AUTH_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?Define AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Define AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - auth-database-network

  carrito-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: ${CARRITO_POSTGRES_DB:?Define CARRITO_POSTGRES_DB}
      POSTGRES_USER: ${CARRITO_POSTGRES_USER:?Define CARRITO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CARRITO_POSTGRES_PASSWORD:?Define CARRITO_POSTGRES_PASSWORD}
    volumes:
      - carrito-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - carrito-database-network

  notifications-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATIONS_POSTGRES_DB:?Define NOTIFICATIONS_POSTGRES_DB}
      POSTGRES_USER: ${NOTIFICATIONS_POSTGRES_USER:?Define NOTIFICATIONS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_POSTGRES_PASSWORD:?Define NOTIFICATIONS_POSTGRES_PASSWORD}
    volumes:
      - notifications-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - notifications-database-network

  recommendation-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_DB: ${RECOMMENDATION_POSTGRES_DB:?Define RECOMMENDATION_POSTGRES_DB}
      POSTGRES_USER: ${RECOMMENDATION_POSTGRES_USER:?Define RECOMMENDATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RECOMMENDATION_POSTGRES_PASSWORD:?Define RECOMMENDATION_POSTGRES_PASSWORD}
    volumes:
      - recommendation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - recommendation-database-network

  pago-postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5438:5432"
    environment:
      POSTGRES_DB: ${PAGO_POSTGRES_DB:?Define PAGO_POSTGRES_DB}
      POSTGRES_USER: ${PAGO_POSTGRES_USER:?Define PAGO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAGO_POSTGRES_PASSWORD:?Define PAGO_POSTGRES_PASSWORD}
    volumes:
      - pago-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - pago-database-network

  # ============================================================
  # BROKERS Y SERVICIOS COMPARTIDOS
  # ============================================================

  rabbitmq:
    image: rabbitmq:4-management
    container_name: camisetas360-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-camisetas360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-camisetas360_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/camisetas360}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app-network

  # ============================================================
  # APACHE KAFKA (MODO KRAFT SIN ZOOKEEPER)
  # ============================================================

  kafka:
    image: apache/kafka:3.8.0
    container_name: camisetas360-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: camisetas360-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Creando tópicos de pago en Kafka..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pago.intento-registrado --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pago.autorizado --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pago.rechazado --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pago.fraude-detectado --partitions 3 --replication-factor 1
        echo "Tópicos disponibles en Kafka:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: camisetas360-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: camisetas360-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - tools

  # ============================================================
  # MICROSERVICIOS SPRING BOOT
  # ============================================================

  auth:
    build:
      context: ./auth
    container_name: app-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      <<: *resource-server-environment
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB:?Define AUTH_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER:?Define AUTH_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Define AUTH_POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:*}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - app-network
      - auth-database-network

  catalog:
    build:
      context: ./catalog
    container_name: app-catalog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *resource-server-environment
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:*}
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-postgres:5432/${CATALOG_POSTGRES_DB:?Define CATALOG_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_POSTGRES_USER:?Define CATALOG_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_POSTGRES_PASSWORD:?Define CATALOG_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      catalog-postgres:
        condition: service_healthy
    networks:
      - app-network
      - catalog-database-network

  carrito:
    build:
      context: ./carrito
    container_name: app-carrito
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      <<: [*rabbitmq-environment, *resource-server-environment]
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://carrito-postgres:5432/${CARRITO_POSTGRES_DB:?Define CARRITO_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${CARRITO_POSTGRES_USER:?Define CARRITO_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${CARRITO_POSTGRES_PASSWORD:?Define CARRITO_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      carrito-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
      - carrito-database-network

  orders:
    build:
      context: ./orders
    container_name: app-orders
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      <<: [*rabbitmq-environment, *resource-server-environment]
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
      - database-network

  notifications:
    build:
      context: ./notifications
    container_name: app-notifications
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      <<: [*rabbitmq-environment, *mail-environment, *resource-server-environment]
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-postgres:5432/${NOTIFICATIONS_POSTGRES_DB:?Define NOTIFICATIONS_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATIONS_POSTGRES_USER:?Define NOTIFICATIONS_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATIONS_POSTGRES_PASSWORD:?Define NOTIFICATIONS_POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      notifications-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network
      - notifications-database-network

  recommendation:
    build:
      context: ./recommendation
    container_name: app-recommendation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      <<: [*rabbitmq-environment, *resource-server-environment]
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://recommendation-postgres:5432/${RECOMMENDATION_POSTGRES_DB:?Define RECOMMENDATION_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${RECOMMENDATION_POSTGRES_USER:?Define RECOMMENDATION_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${RECOMMENDATION_POSTGRES_PASSWORD:?Define RECOMMENDATION_POSTGRES_PASSWORD}
      SPRING_AI_MISTRALAI_API_KEY: ${SPRING_AI_MISTRALAI_API_KEY:-tu_api_key_local}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      recommendation-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
      - recommendation-database-network

  # ============================================================
  # MICROSERVICIO: PAGOS (CON ANTIFRAUDE Y KAFKA)
  # ============================================================

  pagos:
    build:
      context: ./pagos
    container_name: app-pagos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://pago-postgres:5432/${PAGO_POSTGRES_DB:?Define PAGO_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${PAGO_POSTGRES_USER:?Define PAGO_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAGO_POSTGRES_PASSWORD:?Define PAGO_POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTIFRAUDE_MAX_INTENTOS: ${ANTIFRAUDE_MAX_INTENTOS:-3}
      ANTIFRAUDE_VENTANA_SEGUNDOS: ${ANTIFRAUDE_VENTANA_SEGUNDOS:-10}
      ANTIFRAUDE_SECRETO_HASH: ${ANTIFRAUDE_SECRETO_HASH:?Define ANTIFRAUDE_SECRETO_HASH}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:*}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      pago-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - app-network
      - pago-database-network

  # ============================================================
  # FRONTEND ANGULAR (SPA NGINX)
  # ============================================================

  frontend:
    build:
      context: ../camisetas360-frontend
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - app-network

# ============================================================
# VOLÚMENES PERSISTENTES
# ============================================================

volumes:
  rabbitmq-data:
  postgres-data:
  catalog-postgres-data:
  auth-postgres-data:
  carrito-postgres-data:
  notifications-postgres-data:
  recommendation-postgres-data:
  pago-postgres-data:
  kafka-data:

# ============================================================
# REDES AISLADAS
# ============================================================

networks:
  app-network:
    driver: bridge
  database-network:
    driver: bridge
  catalog-database-network:
    driver: bridge
  auth-database-network:
    driver: bridge
  carrito-database-network:
    driver: bridge
  notifications-database-network:
    driver: bridge
  recommendation-database-network:
    driver: bridge
  pago-database-network:
    driver: bridge
