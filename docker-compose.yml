services:
  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    image: camisetas360-catalog:latest
    container_name: app-catalog
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  carrito:
    build:
      context: ./carrito
      dockerfile: Dockerfile
    image: camisetas360-carrito:latest
    container_name: app-carrito
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod