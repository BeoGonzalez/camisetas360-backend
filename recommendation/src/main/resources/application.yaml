server:
  port: 8080

spring:
  application:
    name: recommendation-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    clean-disabled: true

  ai:
    mistralai:
      api-key: ${SPRING_AI_MISTRALAI_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_MISTRALAI_CHAT_MODEL:mistral-small-latest}
          temperature: 0.7

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:camisetas360}
    password: ${RABBITMQ_PASSWORD:camisetas360_dev}
    virtual-host: ${RABBITMQ_VHOST:/camisetas360}
    connection-timeout: 5s
    requested-heartbeat: 30s
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: false # Evita falsos "Unhealthy" por latencia de red en AWS RDS
    rabbit:
      enabled: true # Activado porque recommendation consume eventos por RabbitMQ
    mail:
      enabled: false
