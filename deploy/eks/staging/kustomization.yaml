apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: camisetas360-staging
resources:
  - namespace.yaml
  - ../base
patches:
  - target:
      kind: Deployment
      name: orders
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: staging
