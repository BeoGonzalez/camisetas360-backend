server:
  port: 8081

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:h2:mem:camisetasdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true # Fundamental para que el script corra después de crear las tablas

  sql:
    init:
      mode: always # Fuerza la lectura del data.sql al iniciar

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/
          tenant-id: e5372bf0-c5e3-4286-887c-79069f209c1f