server:
  port: 8081 # El microservicio operará en este puerto de forma local

spring:
  application:
    name: catalog-service

  # Configuración de la base de datos en memoria H2
  datasource:
    url: jdbc:h2:mem:camisetasdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Configuración de JPA e Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Genera las tablas automáticamente a partir de la entidad Product
    show-sql: true # Imprime las consultas en la terminal

  # Configuración de seguridad BFF para validación de tokens de Azure Entra ID
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reemplaza TU_TENANT_ID con el ID de tu directorio en Azure
          issuer-uri: https://login.microsoftonline.com/TU_TENANT_ID/v2.0
          jwk-set-uri: https://login.microsoftonline.com/TU_TENANT_ID/discovery/v2.0/keys