server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0}
          audiences:
            - ${ENTRA_AUDIENCE:719c999d-0f57-4ad5-9bd9-a72be5ca07e0}

app:
  cors:
    enabled: false
  security:
    # Amazon Cognito (clientes externos). Apagado por defecto: con enabled=false solo se confia en Entra ID.
    cognito:
      enabled: ${COGNITO_ENABLED:false}
      # https://cognito-idp.<region>.amazonaws.com/<userPoolId> (sin '/' final; comparacion exacta con 'iss')
      issuer-uri: ${COGNITO_ISSUER_URI:}
      # Opcional: por defecto <issuer-uri>/.well-known/jwks.json
      jwk-set-uri: ${COGNITO_JWK_SET_URI:}
      # App clients autorizados (claim client_id), separados por coma
      client-ids: ${COGNITO_CLIENT_IDS:}
      # Identificador del resource server: el scope <id>/Profile.Read se traduce a SCOPE_Profile.Read
      resource-server-id: ${COGNITO_RESOURCE_SERVER_ID:}
      # Allowlist de cognito:groups (case-sensitive); ADMIN solo si se incluye explicitamente
      allowed-groups: ${COGNITO_ALLOWED_GROUPS:CUSTOMER}
      default-role: ${COGNITO_DEFAULT_ROLE:CUSTOMER}
      # Opcional: https://<dominio>.auth.<region>.amazoncognito.com/oauth2/userInfo (fallback de email/name)
      user-info-uri: ${COGNITO_USER_INFO_URI:}
      user-info-timeout: ${COGNITO_USER_INFO_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false
