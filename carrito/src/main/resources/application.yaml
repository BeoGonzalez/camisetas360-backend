server:
  port: 8082

spring:
  application:
    name: carrito-service

  datasource:
    url: jdbc:h2:mem:carritodb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/
          tenant-id: e5372bf0-c5e3-4286-887c-79069f209c1f