server:
  port: 8080

spring:
  application:
    name: pagos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/camisetas360_pago}
    username: ${SPRING_DATASOURCE_USERNAME:pago}
    password: ${SPRING_DATASOURCE_PASSWORD:pago_dev_password_123}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    default-schema: pago
    schemas:
      - pago
    baseline-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pago
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

antifraude:
  max-intentos: ${ANTIFRAUDE_MAX_INTENTOS:2}
  ventana-segundos: ${ANTIFRAUDE_VENTANA_SEGUNDOS:10}
  # Tras superar el maximo de intentos, la tarjeta queda bloqueada este tiempo (no se alarga con reintentos).
  bloqueo-minutos: ${ANTIFRAUDE_BLOQUEO_MINUTOS:30}
  secreto-hash: ${ANTIFRAUDE_SECRETO_HASH:dev-antifraude-secret-key-360-supersecreto}

# Webpay Plus (Transbank). Por defecto: ambiente de INTEGRACION con las credenciales de prueba publicas
# de Transbank (no cobran). En produccion: WEBPAY_BASE_URL=https://webpay3g.transbank.cl y las del comercio.
webpay:
  base-url: ${WEBPAY_BASE_URL:https://webpay3gint.transbank.cl}
  codigo-comercio: ${WEBPAY_CODIGO_COMERCIO:597055555532}
  api-key: ${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
  # A donde Webpay devuelve al cliente (este servicio, por el API Gateway) y la pagina de resultado del frontend.
  return-url: ${WEBPAY_RETURN_URL:http://localhost:8087/api/v1/pago/webpay/retorno}
  resultado-url: ${WEBPAY_RESULTADO_URL:http://localhost:4200/pago/resultado}
  timeout: ${WEBPAY_TIMEOUT:10s}

outbox:
  scheduler:
    delay-ms: 2000
    batch-size: 50

logging:
  level:
    com.camisetas360.pago: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Igual que el resto de servicios: health publico sin detalles internos, y las caidas
      # de dependencias (BD/Kafka) no deben reiniciar la tarea de ECS.
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    db:
      enabled: false
