name: Deploy Backend to Amazon ECS

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      desired_count:
        description: "Tareas por servicio despues del deploy"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Cluster creado por Terraform (ecs.tf)
  ECS_CLUSTER: ecommerce-cluster

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # 1. Execute the complete backend CI before deployment
  # ============================================================
  tests:
    name: Verify backend before deployment
    uses: ./.github/workflows/ci.yml

  # ============================================================
  # 2. Build immutable Docker images and push them to ECR
  #
  # Los repositorios camisetas360-* los crea Terraform.
  # ============================================================
  build-images:
    name: Build ${{ matrix.service }}
    needs: tests

    if: >-
      ${{ needs.tests.result == 'success' }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: true
      max-parallel: 3

      matrix:
        include:
          - service: auth
            repository: camisetas360-auth

          - service: catalog
            repository: camisetas360-catalog

          - service: carrito
            repository: camisetas360-carrito

          - service: orders
            repository: camisetas360-orders

          - service: notifications
            repository: camisetas360-notifications

          - service: recommendation
            repository: camisetas360-recommendation

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ----------------------------------------------------------
      # AWS Academy / Learner Lab credentials
      #
      # Son credenciales temporales (STS): expiran cuando termina la
      # sesion del lab. Hay que actualizar los tres secrets cada vez
      # que se inicia una sesion nueva.
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          if ! aws sts get-caller-identity; then
            echo "::error::Credenciales AWS invalidas o expiradas. Actualiza AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN desde AWS Details del Learner Lab."
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Download exactly the JAR that passed ci.yml.
      #
      # We do NOT rebuild the JAR here.
      # ----------------------------------------------------------
      - name: Download verified JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jar-${{ matrix.service }}
          path: verified-jar

      - name: Prepare verified Docker build context
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          mkdir -p "${SERVICE}/target"

          mapfile -t jars < <(
            find verified-jar \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one deployable JAR for ${SERVICE}."
            printf 'Found: %s\n' "${jars[@]:-none}"
            exit 1
          fi

          JAR_NAME="$(basename "${jars[0]}")"
          cp "${jars[0]}" "${SERVICE}/target/${JAR_NAME}"
          cp "${jars[0]}" "${SERVICE}/target/app.jar"

          test -s "${SERVICE}/target/${JAR_NAME}"

          echo "Verified artifact:"
          ls -lh "${SERVICE}/target"

      # ----------------------------------------------------------
      # El repositorio ECR debe existir (lo crea Terraform). Este
      # workflow falla en vez de crearlo en silencio.
      # ----------------------------------------------------------
      - name: Verify ECR repository
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "${REPOSITORY}" \
            --region "${AWS_REGION}" \
            >/dev/null

      # ----------------------------------------------------------
      # Tag = Git SHA (no :latest): releases inmutables, auditoria y
      # rollback determinista. Si la imagen ya existe se reutiliza.
      # ----------------------------------------------------------
      - name: Build and push immutable image
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ matrix.repository }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          echo "Target image:"
          echo "${IMAGE}"

          if aws ecr describe-images \
              --repository-name "${REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --region "${AWS_REGION}" \
              >/dev/null 2>&1; then

            echo "Image already exists in ECR."
            echo "Reusing immutable image ${IMAGE}"

          else
            echo "Building ${SERVICE}..."

            docker build \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${IMAGE_TAG}" \
              --tag "${IMAGE}" \
              "./${SERVICE}"

            echo "Pushing ${IMAGE}..."

            docker push "${IMAGE}"
          fi

      - name: Verify image exists in ECR
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].[imageDigest,imageSizeInBytes,imagePushedAt]' \
            --output table

  # ============================================================
  # 3. Deploy the new images to ECS Fargate
  #
  # Los servicios, task definitions, target groups y el NLB los
  # crea Terraform (ecs.tf y service_lb.tf). Aqui solo se registra
  # una revision nueva de la task definition y se actualiza el
  # servicio.
  #
  # max-parallel = 1 evita saturar el lab con muchos despliegues
  # simultaneos (limite de presupuesto y de tareas).
  # ============================================================
  deploy-services:
    name: Deploy ${{ matrix.service }} to ECS
    needs:
      - tests
      - build-images

    if: >-
      ${{
        needs.tests.result == 'success' &&
        needs.build-images.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: true
      max-parallel: 1

      # port = containerPort de la task definition y puerto del
      # target group / listener del NLB (service_lb.tf).
      matrix:
        include:
          - service: auth
            repository: camisetas360-auth
            task-family: auth-task
            ecs-service: auth-service
            container-name: auth
            port: "8081"

          - service: catalog
            repository: camisetas360-catalog
            task-family: catalog-task
            ecs-service: catalog-service
            container-name: catalog
            port: "8080"

          - service: carrito
            repository: camisetas360-carrito
            task-family: carrito-task
            ecs-service: carrito-service
            container-name: carrito
            port: "8083"

          - service: orders
            repository: camisetas360-orders
            task-family: orders-task
            ecs-service: orders-service
            container-name: orders
            port: "8082"

          - service: notifications
            repository: camisetas360-notifications
            task-family: notifications-task
            ecs-service: notifications-service
            container-name: notifications
            port: "8085"

          - service: recommendation
            repository: camisetas360-recommendation
            task-family: recommendation-task
            ecs-service: recommendation-service
            container-name: recommendation
            port: "8084"

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          if ! aws sts get-caller-identity; then
            echo "::error::Credenciales AWS invalidas o expiradas. Actualiza los secrets desde AWS Details del Learner Lab."
            exit 1
          fi

      # ----------------------------------------------------------
      # Confirma que el cluster, el servicio y la task definition
      # creados por Terraform existen antes de cambiar nada.
      # ----------------------------------------------------------
      - name: Verify ECS resources
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
          TASK_FAMILY: ${{ matrix.task-family }}
        run: |
          set -euo pipefail

          echo "Checking ECS cluster..."
          CLUSTER_STATUS="$(
            aws ecs describe-clusters \
              --clusters "${ECS_CLUSTER}" \
              --region "${AWS_REGION}" \
              --query 'clusters[0].status' \
              --output text
          )"

          if [ "${CLUSTER_STATUS}" != "ACTIVE" ]; then
            echo "::error::El cluster ${ECS_CLUSTER} no esta ACTIVE (estado: ${CLUSTER_STATUS}). Ejecuta terraform apply."
            exit 1
          fi

          echo "Checking ECS service..."
          STATUS="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].status' \
              --output text
          )"

          if [ "${STATUS}" != "ACTIVE" ]; then
            echo "::error::El servicio ${ECS_SERVICE} no esta ACTIVE (estado: ${STATUS})."
            exit 1
          fi

          echo "Checking task definition..."
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --region "${AWS_REGION}" \
            >/dev/null

      - name: Resolve image URI
        id: image
        env:
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY}:${IMAGE_TAG}"

          echo "Using image:"
          echo "${IMAGE}"

          # Make sure build-images really published it.
          aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            >/dev/null

          echo "uri=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Download current ECS task definition
        env:
          TASK_FAMILY: ${{ matrix.task-family }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --region "${AWS_REGION}" \
            --query 'taskDefinition' \
            > current-task-definition.json

      - name: Validate target container exists
        env:
          CONTAINER_NAME: ${{ matrix.container-name }}
        run: |
          set -euo pipefail

          jq -e \
            --arg container "${CONTAINER_NAME}" \
            '.containerDefinitions[]
             | select(.name == $container)' \
            current-task-definition.json \
            >/dev/null

      # ----------------------------------------------------------
      # describe-task-definition devuelve campos de solo lectura que
      # register-task-definition no acepta. Se eliminan y se cambia
      # solo la imagen.
      # ----------------------------------------------------------
      - name: Render new ECS task definition
        env:
          CONTAINER_NAME: ${{ matrix.container-name }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          jq \
            --arg container "${CONTAINER_NAME}" \
            --arg image "${IMAGE_URI}" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            (
              .containerDefinitions[]
              | select(.name == $container)
              | .image
            ) = $image
            ' \
            current-task-definition.json \
            > new-task-definition.json

          echo "Container image after rendering:"

          jq \
            --arg container "${CONTAINER_NAME}" \
            '.containerDefinitions[]
             | select(.name == $container)
             | {
                 name: .name,
                 image: .image
               }' \
            new-task-definition.json

      # ----------------------------------------------------------
      # Las task definitions de Terraform no traen variables de
      # entorno ni logs. Se inyectan aqui:
      #
      # - SERVER_PORT: debe coincidir con el target group del NLB.
      # - SPRING_DATASOURCE_*: Aurora (output database_endpoint).
      #   Todos los servicios comparten la base "ecommerce", pero cada
      #   uno usa su propio schema (currentSchema + SPRING_FLYWAY_SCHEMAS).
      #   Sin esto, todos comparten flyway_schema_history en "public" y
      #   las migraciones V1 de cada servicio chocan entre si
      #   ("Migration checksum mismatch for migration version 1").
      # - SPRING_RABBITMQ_*: RabbitMQ a traves del NLB (puerto 5672).
      # - awslogs: logs en CloudWatch (/ecs/<servicio>).
      #
      # Variables del repositorio (vars): DB_ENDPOINT, NLB_DNS,
      # y opcionalmente DB_NAME, DB_USERNAME, RABBITMQ_USERNAME.
      # Secrets: DB_PASSWORD, RABBITMQ_PASSWORD.
      #
      # Nota: en un entorno real conviene usar "secrets" de ECS con
      # Secrets Manager en vez de valores en texto plano.
      # ----------------------------------------------------------
      - name: Inject runtime configuration
        env:
          CONTAINER_NAME: ${{ matrix.container-name }}
          SERVICE: ${{ matrix.service }}
          SERVER_PORT: ${{ matrix.port }}
          DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
          DB_NAME: ${{ vars.DB_NAME || 'ecommerce' }}
          DB_USERNAME: ${{ vars.DB_USERNAME || 'dbadmin' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NLB_DNS: ${{ vars.NLB_DNS }}
          RABBITMQ_USERNAME: ${{ vars.RABBITMQ_USERNAME || 'admin' }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME || 'dummy' }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD || 'dummy' }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'dummy' }}
          # NUEVA VARIABLE PARA MISTRAL AI
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || 'dummy_api_key' }}
        run: |
          set -euo pipefail

          : "${DB_ENDPOINT:?Falta la variable DB_ENDPOINT del repositorio (terraform output database_endpoint)}"
          : "${NLB_DNS:?Falta la variable NLB_DNS del repositorio (terraform output internal_nlb_dns)}"
          : "${DB_PASSWORD:?Falta el secret DB_PASSWORD}"
          : "${RABBITMQ_PASSWORD:?Falta el secret RABBITMQ_PASSWORD}"

          jq \
            --arg container "${CONTAINER_NAME}" \
            --arg port "${SERVER_PORT}" \
            --arg dbUrl "jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}?currentSchema=${SERVICE}" \
            --arg schema "${SERVICE}" \
            --arg dbUser "${DB_USERNAME}" \
            --arg dbPass "${DB_PASSWORD}" \
            --arg rabbitHost "${NLB_DNS}" \
            --arg rabbitUser "${RABBITMQ_USERNAME}" \
            --arg rabbitPass "${RABBITMQ_PASSWORD}" \
            --arg logGroup "/ecs/${SERVICE}" \
            --arg region "${AWS_REGION}" \
            --arg mailUser "${MAIL_USERNAME}" \
            --arg mailPass "${MAIL_PASSWORD}" \
            --arg mailFrom "${MAIL_FROM}" \
            --arg mistralKey "${MISTRAL_API_KEY}" \
            '
            [
              {name: "SERVER_PORT", value: $port},
              {name: "SPRING_DATASOURCE_URL", value: $dbUrl},
              {name: "SPRING_FLYWAY_SCHEMAS", value: $schema},
              {name: "SPRING_DATASOURCE_USERNAME", value: $dbUser},
              {name: "SPRING_DATASOURCE_PASSWORD", value: $dbPass},
              {name: "SPRING_RABBITMQ_HOST", value: $rabbitHost},
              {name: "SPRING_RABBITMQ_PORT", value: "5672"},
              {name: "SPRING_RABBITMQ_USERNAME", value: $rabbitUser},
              {name: "SPRING_RABBITMQ_PASSWORD", value: $rabbitPass},
              {name: "SPRING_RABBITMQ_VIRTUAL_HOST", value: "/"},
              {name: "MAIL_USERNAME", value: $mailUser},
              {name: "MAIL_PASSWORD", value: $mailPass},
              {name: "MAIL_FROM", value: $mailFrom},
              {name: "SPRING_AI_MISTRALAI_API_KEY", value: $mistralKey}
            ] as $injected
            |
            (.containerDefinitions[] | select(.name == $container)) |= (
              .environment = (
                ((.environment // [])
                  | map(select(.name as $n | ($injected | map(.name) | index($n)) | not)))
                + $injected
              )
              | .logConfiguration = {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group": $logGroup,
                    "awslogs-region": $region,
                    "awslogs-stream-prefix": "ecs",
                    "awslogs-create-group": "true"
                  }
                }
            )
            ' \
            new-task-definition.json \
            > new-task-definition.injected.json

          mv new-task-definition.injected.json new-task-definition.json

          echo "Environment variable names configured for ${CONTAINER_NAME}:"
          jq -r \
            --arg container "${CONTAINER_NAME}" \
            '.containerDefinitions[]
             | select(.name == $container)
             | .environment[].name' \
            new-task-definition.json

      - name: Register new task definition revision
        id: register
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://new-task-definition.json \
              --region "${AWS_REGION}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "Registered:"
          echo "${TASK_DEFINITION_ARN}"

          echo "arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      # ----------------------------------------------------------
      # Terraform crea los servicios con desired_count = 0. Si no se
      # sube el contador, el deploy "termina bien" sin correr nada.
      # Por eso se fija el desired-count aqui (por defecto 1).
      #
      # Requiere en Terraform, dentro de cada aws_ecs_service backend:
      #   lifecycle { ignore_changes = [task_definition, desired_count] }
      # ----------------------------------------------------------
      - name: Deploy task definition to ECS service
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
          DESIRED_COUNT: ${{ inputs.desired_count || '1' }}
        run: |
          set -euo pipefail

          if ! [[ "${DESIRED_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::desired_count debe ser un entero mayor a 0 (recibido: ${DESIRED_COUNT})."
            exit 1
          fi

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --desired-count "${DESIRED_COUNT}" \
            --health-check-grace-period-seconds 180 \
            --force-new-deployment \
            --region "${AWS_REGION}" \
            >/dev/null

          echo "Deployment started:"
          echo "Service: ${ECS_SERVICE}"
          echo "Task definition: ${TASK_DEFINITION_ARN}"
          echo "Desired count: ${DESIRED_COUNT}"

      # ----------------------------------------------------------
      # Espera a que ECS declare el servicio estable (las tareas
      # pasan el health check del target group del NLB). El comando
      # wait corta a los 10 minutos, por eso se reintenta hasta 3
      # veces. Si falla, imprime eventos y motivo de las tareas
      # detenidas para poder diagnosticar.
      # ----------------------------------------------------------
      - name: Wait for ECS service to become stable
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
        run: |
          set -euo pipefail

          echo "Waiting for ${ECS_SERVICE}..."

          ATTEMPTS=0
          MAX_ATTEMPTS=3

          while (( ATTEMPTS < MAX_ATTEMPTS )); do
            if aws ecs wait services-stable \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}"; then

              echo "${ECS_SERVICE} is stable."
              exit 0
            else
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "Intento ${ATTEMPTS} de ${MAX_ATTEMPTS}: el servicio aun no se estabiliza."
            fi
          done

          echo "::error::El servicio ${ECS_SERVICE} no se estabilizo despues de $((MAX_ATTEMPTS * 10)) minutos."

          echo "--- Ultimos eventos del servicio ---"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[0].events[:10].message' \
            --output json

          echo "--- Tareas detenidas recientemente ---"
          STOPPED="$(
            aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --region "${AWS_REGION}" \
              --query 'taskArns[:3]' \
              --output text
          )"

          if [ -n "${STOPPED}" ] && [ "${STOPPED}" != "None" ]; then
            # shellcheck disable=SC2086
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${STOPPED} \
              --region "${AWS_REGION}" \
              --query 'tasks[].{Reason:stoppedReason,Containers:containers[].{Name:name,Reason:reason,ExitCode:exitCode}}' \
              --output json
          fi

          exit 1

      - name: Verify deployed service
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
            --query '
              services[0].{
                Service:serviceName,
                Status:status,
                Desired:desiredCount,
                Running:runningCount,
                Pending:pendingCount,
                TaskDefinition:taskDefinition
              }
            ' \
            --output table

          DESIRED="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].desiredCount' \
              --output text
          )"

          RUNNING="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --region "${AWS_REGION}" \
              --query 'services[0].runningCount' \
              --output text
          )"

          if [ "${DESIRED}" -lt 1 ] || [ "${RUNNING}" -ne "${DESIRED}" ]; then
            echo "::error::${ECS_SERVICE} no esta corriendo todas sus tareas (running=${RUNNING}, desired=${DESIRED})."
            exit 1
          fi

  # ============================================================
  # 4. Final deployment gate
  # ============================================================
  deployment-gate:
    name: Backend deployment successful
    needs:
      - tests
      - build-images
      - deploy-services

    if: ${{ always() }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require complete deployment success
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          DEPLOY_RESULT: ${{ needs.deploy-services.result }}
        run: |
          set -euo pipefail

          echo "Tests:  ${TESTS_RESULT}"
          echo "Build:  ${BUILD_RESULT}"
          echo "Deploy: ${DEPLOY_RESULT}"

          test "${TESTS_RESULT}" = "success"
          test "${BUILD_RESULT}" = "success"
          test "${DEPLOY_RESULT}" = "success"

      - name: Write deployment summary
        run: |
          {
            echo "## Camisetas360 Backend Deployment"
            echo
            echo "- Environment: production"
            echo "- AWS region: ${AWS_REGION}"
            echo "- ECS cluster: ${ECS_CLUSTER} (Fargate)"
            echo "- Git commit: \`${GITHUB_SHA}\`"
            echo "- Result: successful"
            echo
            echo "Services:"
            echo "- auth (8081)"
            echo "- catalog (8080)"
            echo "- carrito (8083)"
            echo "- orders (8082)"
            echo "- notifications (8085)"
            echo "- recommendation (8084)"
          } >> "${GITHUB_STEP_SUMMARY}"
