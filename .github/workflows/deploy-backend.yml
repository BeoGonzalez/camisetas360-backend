name: Deploy Backend to Amazon ECS

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      desired_count:
        description: "Tareas por servicio despues del deploy"
        required: false
        default: "1"
        type: string
      services:
        description: "Servicios a desplegar separados por coma (o 'all')"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: ecommerce-cluster

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # 0. Preflight (corre en paralelo con los tests)
  #
  # Falla rapido si faltan credenciales, variables, secrets o
  # recursos de AWS, antes de gastar minutos construyendo imagenes.
  #
  # El catalogo de servicios se define UNA sola vez aqui y se
  # entrega como matriz a build-images y deploy-services.
  #
  # kind      = app (microservicio: JAR verificado por ci.yml, tag = SHA
  #             del commit) | broker (RabbitMQ/Kafka: imagen construida
  #             desde deploy/ecs/<service>, tag = hash de esa carpeta).
  # port      = containerPort de la task definition y puerto del
  #             listener/target group del NLB interno.
  # db-schema = schema propio en la base Aurora compartida ("" = no usa
  #             Aurora; analytics persiste en DynamoDB).
  # cpu/memory = tamano de la tarea Fargate que se fuerza en cada deploy
  #             ("" = se conserva el de la task definition actual).
  #             recommendation usa 2 vCPU / 8 GB (equivalente a t3.large)
  #             por TensorFlow.
  #
  # El ORDEN importa: con max-parallel 1 los jobs de la matriz corren en
  # el orden del catalogo. Primero los brokers (los servicios se conectan
  # al arrancar) y orders al final, cuando notifications y recommendation
  # ya declararon sus colas de order.created.
  # ============================================================
  preflight:
    name: Preflight AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: production

    outputs:
      services: ${{ steps.catalog.outputs.services }}
      catalog: ${{ steps.catalog.outputs.catalog }}

    steps:
      - name: Build service catalog
        id: catalog
        env:
          REQUESTED: ${{ inputs.services || 'all' }}
        run: |
          set -euo pipefail

          CATALOG='[
            {"service":"rabbitmq","kind":"broker","repository":"camisetas360-rabbitmq","task-family":"rabbitmq-task","ecs-service":"rabbitmq-service","container-name":"rabbitmq","port":"5672","db-schema":"","cpu":"512","memory":"1024"},
            {"service":"kafka","kind":"broker","repository":"camisetas360-kafka","task-family":"kafka-task","ecs-service":"kafka-service","container-name":"kafka","port":"9092","db-schema":"","cpu":"1024","memory":"2048"},
            {"service":"auth","kind":"app","repository":"camisetas360-auth","task-family":"auth-task","ecs-service":"auth-service","container-name":"auth","port":"8081","db-schema":"auth","cpu":"","memory":""},
            {"service":"catalog","kind":"app","repository":"camisetas360-catalog","task-family":"catalog-task","ecs-service":"catalog-service","container-name":"catalog","port":"8080","db-schema":"catalog","cpu":"","memory":""},
            {"service":"notifications","kind":"app","repository":"camisetas360-notifications","task-family":"notifications-task","ecs-service":"notifications-service","container-name":"notifications","port":"8085","db-schema":"notifications","cpu":"","memory":""},
            {"service":"recommendation","kind":"app","repository":"camisetas360-recommendation","task-family":"recommendation-task","ecs-service":"recommendation-service","container-name":"recommendation","port":"8084","db-schema":"recommendation","cpu":"2048","memory":"8192"},
            {"service":"analytics","kind":"app","repository":"camisetas360-analytics","task-family":"analytics-task","ecs-service":"analytics-service","container-name":"analytics","port":"8086","db-schema":"","cpu":"","memory":""},
            {"service":"pagos","kind":"app","repository":"camisetas360-pagos","task-family":"pagos-task","ecs-service":"pagos-service","container-name":"pagos","port":"8087","db-schema":"pago","cpu":"","memory":""},
            {"service":"carrito","kind":"app","repository":"camisetas360-carrito","task-family":"carrito-task","ecs-service":"carrito-service","container-name":"carrito","port":"8083","db-schema":"carrito","cpu":"","memory":""},
            {"service":"orders","kind":"app","repository":"camisetas360-orders","task-family":"orders-task","ecs-service":"orders-service","container-name":"orders","port":"8082","db-schema":"orders","cpu":"","memory":""}
          ]'

          if [ "${REQUESTED}" = "all" ]; then
            SELECTED="$(jq -c '{include: .}' <<< "${CATALOG}")"
          else
            SELECTED="$(jq -c --arg req "${REQUESTED}" '
              ($req | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $wanted
              | {include: map(select(.service as $s | $wanted | index($s)))}
            ' <<< "${CATALOG}")"
          fi

          COUNT="$(jq '.include | length' <<< "${SELECTED}")"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::Ningun servicio coincide con '${REQUESTED}'."
            exit 1
          fi

          echo "Servicios seleccionados:"
          jq -r '.include[].service' <<< "${SELECTED}"
          echo "services=${SELECTED}" >> "${GITHUB_OUTPUT}"
          # El aprovisionamiento siempre asegura el catalogo completo.
          echo "catalog=$(jq -c . <<< "${CATALOG}")" >> "${GITHUB_OUTPUT}"

      - name: Validate repository variables and secrets
        env:
          BACKEND_SUBNET_ID: ${{ vars.BACKEND_SUBNET_ID }}
          DATABASE_SUBNET_ID: ${{ vars.DATABASE_SUBNET_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          COGNITO_ENABLED: ${{ vars.COGNITO_ENABLED }}
          COGNITO_ISSUER_URI: ${{ vars.COGNITO_ISSUER_URI }}
          COGNITO_CLIENT_IDS: ${{ vars.COGNITO_CLIENT_IDS }}
          COGNITO_RESOURCE_SERVER_ID: ${{ vars.COGNITO_RESOURCE_SERVER_ID }}
          SERVICES: ${{ steps.catalog.outputs.services }}
        run: |
          set -euo pipefail
          MISSING=0

          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::Falta ${2} ${1}."
              MISSING=1
            fi
          }

          # Subredes donde el pipeline crea el NLB, las tareas (privada 1) y Aurora (privada 2).
          require BACKEND_SUBNET_ID "la variable"
          require DATABASE_SUBNET_ID "la variable"
          # Contrasena maestra con la que el job provision crea Aurora.
          require DB_PASSWORD "el secret"

          # Las credenciales de las aplicaciones (contrasenas de Aurora y RabbitMQ,
          # antifraude, SMTP) NO van en el repositorio: se registran a mano en cada
          # task definition de ECS, y deploy-services verifica que esten.

          # auth con Amazon Cognito: sin estas variables el contenedor fallaria al arrancar (fail-fast).
          if jq -e '.include[] | select(.service == "auth")' <<< "${SERVICES}" >/dev/null; then
            case "${COGNITO_ENABLED:-false}" in
              true)
                require COGNITO_ISSUER_URI "la variable"
                require COGNITO_CLIENT_IDS "la variable"
                require COGNITO_RESOURCE_SERVER_ID "la variable"
                ;;
              false) ;;
              *) echo "::error::COGNITO_ENABLED debe ser 'true' o 'false'."; MISSING=1 ;;
            esac
          fi

          if jq -e '.include[] | select(.service | IN("pagos", "catalog", "carrito", "analytics", "recommendation"))' <<< "${SERVICES}" >/dev/null \
             && [ -z "${KAFKA_BOOTSTRAP_SERVERS}" ]; then
            echo "::notice::KAFKA_BOOTSTRAP_SERVERS no esta definida; se usara <NLB>:9092 (Kafka en ECS detras del NLB)."
          fi

          if jq -e '.include[] | select(.service == "analytics")' <<< "${SERVICES}" >/dev/null \
             && [ -z "${FRONTEND_ORIGIN}" ]; then
            echo "::warning::FRONTEND_ORIGIN no esta definida; el dashboard WebSocket rechazara el origen del frontend."
          fi

          exit "${MISSING}"

      # ----------------------------------------------------------
      # AWS Academy / Learner Lab: credenciales STS temporales.
      # Actualiza AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y
      # AWS_SESSION_TOKEN (AWS Details) en cada sesion nueva.
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          if ! aws sts get-caller-identity; then
            echo "::error::Credenciales AWS invalidas o expiradas. Actualiza los secrets desde AWS Details del Learner Lab."
            exit 1
          fi

  # ============================================================
  # 1. Execute the complete backend CI before deployment
  # ============================================================
  tests:
    name: Verify backend before deployment
    uses: ./.github/workflows/ci.yml

  # ============================================================
  # 1b. Aprovisionamiento (en paralelo con los tests)
  #
  # Crea lo que falte, en este orden: ECR -> ECS (cluster, log
  # groups, task definitions) -> NLB (grupos de seguridad, target
  # groups, listeners) -> Aurora PostgreSQL -> DynamoDB (tabla
  # ConexionesWebSocket de la telemetria) -> servicios ECS.
  # Es idempotente: en los despliegues siguientes solo verifica.
  # La primera vez tarda ~20 min (Aurora); despues, ~1 min.
  # ============================================================
  provision:
    name: Provision AWS infrastructure
    needs:
      - preflight

    runs-on: ubuntu-24.04
    timeout-minutes: 50

    environment:
      name: production

    outputs:
      nlb_dns: ${{ steps.provision.outputs.nlb_dns }}
      db_endpoint: ${{ steps.provision.outputs.db_endpoint }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR, ECS, NLB, Aurora and ECS services
        id: provision
        env:
          CATALOG: ${{ needs.preflight.outputs.catalog }}
          BACKEND_SUBNET_ID: ${{ vars.BACKEND_SUBNET_ID }}
          DATABASE_SUBNET_ID: ${{ vars.DATABASE_SUBNET_ID }}
          DB_NAME: ${{ vars.DB_NAME || 'ecommerce' }}
          DB_USERNAME: ${{ vars.DB_USERNAME || 'dbadmin' }}
          DB_INSTANCE_CLASS: ${{ vars.DB_INSTANCE_CLASS || 'db.t4g.medium' }}
          # Solo para CREAR Aurora (contrasena maestra). Los contenedores la reciben
          # a mano en su task definition (SPRING_DATASOURCE_PASSWORD).
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: bash deploy/aws/provision.sh

  # ============================================================
  # 2. Build immutable Docker images and push them to ECR
  #
  # Se reutiliza exactamente el JAR verificado por ci.yml.
  # ============================================================
  build-images:
    name: Build ${{ matrix.service }}
    needs:
      - preflight
      - tests
      - provision

    if: >-
      ${{
        needs.preflight.result == 'success' &&
        needs.tests.result == 'success' &&
        needs.provision.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.preflight.outputs.services) }}

    environment:
      name: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download verified JAR
        if: ${{ matrix.kind == 'app' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jar-${{ matrix.service }}
          path: verified-jar

      - name: Verify JAR checksum
        if: ${{ matrix.kind == 'app' }}
        run: |
          set -euo pipefail
          cd verified-jar
          sha256sum -c ./*.sha256

      - name: Prepare verified Docker build context
        if: ${{ matrix.kind == 'app' }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find verified-jar \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one deployable JAR for ${SERVICE}."
            printf 'Found: %s\n' "${jars[@]:-none}"
            exit 1
          fi

          # The Dockerfile copies target/*-SNAPSHOT.jar: exactly one file.
          rm -rf "${SERVICE}/target"
          mkdir -p "${SERVICE}/target"
          cp "${jars[0]}" "${SERVICE}/target/"

          ls -lh "${SERVICE}/target"

      # ----------------------------------------------------------
      # Microservicios: tag = Git SHA (no :latest), releases inmutables
      # y rollback determinista.
      # Brokers: tag = hash de deploy/ecs/<service>. Mientras esa carpeta
      # no cambie, el tag (y la task definition) es el mismo y el broker
      # NO se reinicia en cada push (su disco en Fargate es efimero).
      # ----------------------------------------------------------
      - name: Resolve image tag and build context
        id: tag
        env:
          SERVICE: ${{ matrix.service }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail

          if [ "${KIND}" = "broker" ]; then
            echo "tag=cfg-$(git rev-parse --short=12 "HEAD:deploy/ecs/${SERVICE}")" >> "${GITHUB_OUTPUT}"
            echo "context=./deploy/ecs/${SERVICE}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "context=./${SERVICE}" >> "${GITHUB_OUTPUT}"
          fi

      # Si la imagen ya existe se reutiliza. Fargate corre en linux/amd64.
      - name: Build and push immutable image
        env:
          REPOSITORY: ${{ matrix.repository }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_CONTEXT: ${{ steps.tag.outputs.context }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          echo "Target image: ${IMAGE}"

          if aws ecr describe-images \
              --repository-name "${REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              >/dev/null 2>&1; then
            echo "Image already exists in ECR. Reusing ${IMAGE}"
            exit 0
          fi

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --tag "${IMAGE}" \
            "${BUILD_CONTEXT}"

          docker push "${IMAGE}"

          aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].[imageDigest,imageSizeInBytes,imagePushedAt]' \
            --output table

  # ============================================================
  # 3. Deploy the new images to ECS Fargate
  #
  # Se toma la task definition existente (LabRole como task role y
  # execution role), se cambia la imagen, se inyecta la
  # configuracion de runtime y se registra una revision nueva.
  #
  # max-parallel = 1 evita saturar el lab (presupuesto y tareas).
  # ============================================================
  deploy-services:
    name: Deploy ${{ matrix.service }} to ECS
    needs:
      - preflight
      - provision
      - build-images

    if: >-
      ${{
        needs.preflight.result == 'success' &&
        needs.provision.result == 'success' &&
        needs.build-images.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.services) }}

    environment:
      name: production

    steps:
      # Solo los brokers lo necesitan: su tag es el hash de deploy/ecs/<service>.
      - name: Checkout source code
        if: ${{ matrix.kind == 'broker' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image URI
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          KIND: ${{ matrix.kind }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail

          if [ "${KIND}" = "broker" ]; then
            IMAGE_TAG="cfg-$(git rev-parse --short=12 "HEAD:deploy/ecs/${SERVICE}")"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY}:${IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            >/dev/null

          echo "Using image: ${IMAGE}"
          echo "uri=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Download and validate current task definition
        env:
          TASK_FAMILY: ${{ matrix.task-family }}
          CONTAINER_NAME: ${{ matrix.container-name }}
          SERVER_PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition' \
            > current-task-definition.json

          fail() { echo "::error::${TASK_FAMILY}: $1"; exit 1; }

          jq -e --arg c "${CONTAINER_NAME}" '.containerDefinitions[] | select(.name == $c)' \
            current-task-definition.json >/dev/null \
            || fail "no existe el contenedor '${CONTAINER_NAME}'."

          jq -e '.networkMode == "awsvpc"' current-task-definition.json >/dev/null \
            || fail "Fargate requiere networkMode awsvpc."

          jq -e '(.requiresCompatibilities // []) | index("FARGATE")' current-task-definition.json >/dev/null \
            || fail "requiresCompatibilities debe incluir FARGATE."

          jq -e '.executionRoleArn // "" | test("LabRole")' current-task-definition.json >/dev/null \
            || fail "executionRoleArn debe ser LabRole (necesario para leer ECR y escribir CloudWatch Logs)."

          jq -e '.taskRoleArn // "" | test("LabRole")' current-task-definition.json >/dev/null \
            || fail "taskRoleArn debe ser LabRole (analytics y recommendation lo usan para acceder a DynamoDB)."

          jq -e --arg c "${CONTAINER_NAME}" --argjson p "${SERVER_PORT}" '
            .containerDefinitions[] | select(.name == $c)
            | (.portMappings // []) | map(.containerPort) | index($p)
          ' current-task-definition.json >/dev/null \
            || fail "el contenedor no expone containerPort ${SERVER_PORT} (debe coincidir con el target group del NLB)."

          echo "Task definition valida:"
          jq '{family, cpu, memory, networkMode, executionRoleArn, taskRoleArn}' current-task-definition.json

      # ----------------------------------------------------------
      # Configuracion de runtime NO secreta. Cada servicio recibe solo
      # lo que necesita.
      #
      # Las CREDENCIALES no las inyecta el pipeline: se registran a mano
      # en cada task definition (consola de ECS) y el render las
      # conserva, porque solo reemplaza las variables que el mismo
      # inyecta. El paso siguiente verifica que esten.
      #
      # Aurora: una base compartida (DB_NAME) con un schema por
      # servicio (currentSchema + SPRING_FLYWAY_SCHEMAS), para que
      # cada servicio tenga su propio flyway_schema_history.
      # ----------------------------------------------------------
      - name: Render new task definition
        env:
          SERVICE: ${{ matrix.service }}
          KIND: ${{ matrix.kind }}
          TASK_CPU: ${{ matrix.cpu }}
          TASK_MEMORY: ${{ matrix.memory }}
          CONTAINER_NAME: ${{ matrix.container-name }}
          SERVER_PORT: ${{ matrix.port }}
          DB_SCHEMA: ${{ matrix.db-schema }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          # Los crea el job provision; una variable de GitHub con valor los reemplaza.
          DB_ENDPOINT: ${{ vars.DB_ENDPOINT || needs.provision.outputs.db_endpoint }}
          DB_NAME: ${{ vars.DB_NAME || 'ecommerce' }}
          DB_USERNAME: ${{ vars.DB_USERNAME || 'dbadmin' }}
          NLB_DNS: ${{ vars.NLB_DNS || needs.provision.outputs.nlb_dns }}
          RABBITMQ_USERNAME: ${{ vars.RABBITMQ_USERNAME || 'admin' }}
          RABBITMQ_VHOST: ${{ vars.RABBITMQ_VHOST || '/' }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME || 'dummy' }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'dummy' }}
          ENTRA_ISSUER_URI: ${{ vars.ENTRA_ISSUER_URI }}
          ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          CATALOG_BASE_URL: ${{ vars.CATALOG_BASE_URL }}
          COGNITO_ENABLED: ${{ vars.COGNITO_ENABLED || 'false' }}
          COGNITO_ISSUER_URI: ${{ vars.COGNITO_ISSUER_URI }}
          COGNITO_JWK_SET_URI: ${{ vars.COGNITO_JWK_SET_URI }}
          COGNITO_CLIENT_IDS: ${{ vars.COGNITO_CLIENT_IDS }}
          COGNITO_RESOURCE_SERVER_ID: ${{ vars.COGNITO_RESOURCE_SERVER_ID }}
          COGNITO_ALLOWED_GROUPS: ${{ vars.COGNITO_ALLOWED_GROUPS }}
          COGNITO_DEFAULT_ROLE: ${{ vars.COGNITO_DEFAULT_ROLE }}
          COGNITO_USER_INFO_URI: ${{ vars.COGNITO_USER_INFO_URI }}
          COGNITO_USER_INFO_TIMEOUT: ${{ vars.COGNITO_USER_INFO_TIMEOUT }}
        run: |
          set -euo pipefail

          KAFKA="${KAFKA_BOOTSTRAP_SERVERS:-${NLB_DNS}:9092}"
          # carrito valida precios contra catalog por el NLB (listener 8080).
          CATALOG_BASE_URL="${CATALOG_BASE_URL:-http://${NLB_DNS}:8080}"

          jq \
            --arg service "${SERVICE}" \
            --arg kind "${KIND}" \
            --arg taskCpu "${TASK_CPU}" \
            --arg taskMemory "${TASK_MEMORY}" \
            --arg container "${CONTAINER_NAME}" \
            --arg image "${IMAGE_URI}" \
            --arg port "${SERVER_PORT}" \
            --arg dbUrl "jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}?currentSchema=${DB_SCHEMA}&sslmode=require" \
            --arg schema "${DB_SCHEMA}" \
            --arg dbUser "${DB_USERNAME}" \
            --arg rabbitHost "${NLB_DNS}" \
            --arg rabbitUser "${RABBITMQ_USERNAME}" \
            --arg rabbitVhost "${RABBITMQ_VHOST}" \
            --arg kafka "${KAFKA}" \
            --arg mailUser "${MAIL_USERNAME}" \
            --arg mailFrom "${MAIL_FROM}" \
            --arg entraIssuer "${ENTRA_ISSUER_URI}" \
            --arg entraAudience "${ENTRA_AUDIENCE}" \
            --arg frontendOrigin "${FRONTEND_ORIGIN}" \
            --arg catalogUrl "${CATALOG_BASE_URL}" \
            --arg cognitoEnabled "${COGNITO_ENABLED}" \
            --arg cognitoIssuer "${COGNITO_ISSUER_URI}" \
            --arg cognitoJwks "${COGNITO_JWK_SET_URI}" \
            --arg cognitoClients "${COGNITO_CLIENT_IDS}" \
            --arg cognitoResourceServer "${COGNITO_RESOURCE_SERVER_ID}" \
            --arg cognitoGroups "${COGNITO_ALLOWED_GROUPS}" \
            --arg cognitoDefaultRole "${COGNITO_DEFAULT_ROLE}" \
            --arg cognitoUserInfo "${COGNITO_USER_INFO_URI}" \
            --arg cognitoUserInfoTimeout "${COGNITO_USER_INFO_TIMEOUT}" \
            --arg logGroup "/ecs/${SERVICE}" \
            --arg region "${AWS_REGION}" \
            '
            def kv($n; $v): {name: $n, value: $v};

            (
              # Brokers: solo su propia configuracion. El usuario y el vhost de RabbitMQ son
              # los que usan los microservicios (su contrasena, RABBITMQ_DEFAULT_PASS, va a mano);
              # Kafka anuncia la misma direccion (el NLB) que reciben los clientes.
              if $kind == "broker" then
                (if $service == "rabbitmq" then [
                    kv("RABBITMQ_DEFAULT_USER"; $rabbitUser),
                    kv("RABBITMQ_DEFAULT_VHOST"; $rabbitVhost)
                  ] else [
                    kv("KAFKA_ADVERTISED_LISTENERS"; "PLAINTEXT://" + $kafka)
                  ] end)
              else
              [
                kv("SERVER_PORT"; $port),
                # JVM ajustada al limite de memoria de la tarea Fargate.
                kv("JAVA_TOOL_OPTIONS"; "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError")
              ]
              + (if $schema != "" then [
                  kv("SPRING_DATASOURCE_URL"; $dbUrl),
                  kv("SPRING_FLYWAY_SCHEMAS"; $schema),
                  kv("SPRING_DATASOURCE_USERNAME"; $dbUser)
                ] else [] end)
              + (if ($service | IN("pagos", "catalog", "carrito", "analytics", "recommendation")) then [
                  kv("KAFKA_BOOTSTRAP_SERVERS"; $kafka)
                ] else [] end)
              + (if $entraIssuer != "" then [kv("ENTRA_ISSUER_URI"; $entraIssuer)] else [] end)
              + (if $entraAudience != "" then [kv("ENTRA_AUDIENCE"; $entraAudience)] else [] end)
              + (if ($service | IN("carrito", "orders", "notifications", "recommendation")) then [
                  kv("SPRING_RABBITMQ_HOST"; $rabbitHost),
                  kv("SPRING_RABBITMQ_PORT"; "5672"),
                  kv("SPRING_RABBITMQ_USERNAME"; $rabbitUser),
                  kv("SPRING_RABBITMQ_VIRTUAL_HOST"; $rabbitVhost)
                ] else [] end)
              + (if $service == "notifications" then [
                  kv("MAIL_USERNAME"; $mailUser),
                  kv("MAIL_FROM"; $mailFrom)
                ] else [] end)
              + (if $service == "carrito" then [
                  kv("CATALOG_BASE_URL"; $catalogUrl)
                ] else [] end)
              # Amazon Cognito como segundo issuer de auth. Siempre se inyecta COGNITO_ENABLED para que
              # desactivarlo en GitHub lo desactive tambien en la task definition; el resto solo si tiene valor.
              + (if $service == "auth" then
                  [kv("COGNITO_ENABLED"; $cognitoEnabled)]
                  + ([
                      ["COGNITO_ISSUER_URI", $cognitoIssuer],
                      ["COGNITO_JWK_SET_URI", $cognitoJwks],
                      ["COGNITO_CLIENT_IDS", $cognitoClients],
                      ["COGNITO_RESOURCE_SERVER_ID", $cognitoResourceServer],
                      ["COGNITO_ALLOWED_GROUPS", $cognitoGroups],
                      ["COGNITO_DEFAULT_ROLE", $cognitoDefaultRole],
                      ["COGNITO_USER_INFO_URI", $cognitoUserInfo],
                      ["COGNITO_USER_INFO_TIMEOUT", $cognitoUserInfoTimeout]
                    ] | map(select(.[1] != "") | kv(.[0]; .[1])))
                else [] end)
              # DynamoDB es OBLIGATORIO en AWS para recommendation (UserInteractions) y para
              # analytics (fuente de la telemetria). Se fija aqui en cada deploy para que una
              # variable vieja en la task definition no pueda apagarlo; las credenciales son
              # las del task role (LabRole) y las tablas se crean al arrancar (on-demand).
              + (if $service == "recommendation" then [
                  kv("AWS_REGION"; $region),
                  kv("DYNAMODB_ENABLED"; "true"),
                  kv("DYNAMODB_CREATE_TABLES"; "true"),
                  kv("DYNAMODB_TABLA_INTERACCIONES"; "UserInteractions")
                ] else [] end)
              + (if $service == "analytics" then [
                  kv("AWS_REGION"; $region),
                  kv("DYNAMODB_CREATE_TABLES"; "true"),
                  kv("DYNAMODB_PRODUCTOS_STREAM"; "true"),
                  kv("WEBSOCKET_ALLOWED_ORIGINS"; $frontendOrigin)
                ] else [] end)
              end
            ) as $injected
            | ($injected | map(.name)) as $names
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
            # Tamano de tarea fijado en el catalogo (p. ej. recommendation 2 vCPU / 8 GB).
            # Se quitan los limites a nivel de contenedor para que la JVM vea toda la tarea.
            | (if $taskCpu != "" then .cpu = $taskCpu else . end)
            | (if $taskMemory != "" then .memory = $taskMemory else . end)
            | (.containerDefinitions[] | select(.name == $container)) |= (
                (if $taskMemory != "" then del(.cpu, .memory, .memoryReservation) else . end)
                | .image = $image
                | .essential = true
                # Solo se reemplazan las variables inyectadas; las demas (las credenciales
                # registradas a mano y cualquier "secrets" con valueFrom) se conservan.
                | .environment = (
                    ((.environment // []) | map(select(.name as $n | $names | index($n) | not)))
                    + $injected
                  )
                | .logConfiguration = {
                    logDriver: "awslogs",
                    options: {
                      "awslogs-group": $logGroup,
                      "awslogs-region": $region,
                      "awslogs-stream-prefix": "ecs",
                      "awslogs-create-group": "true"
                    }
                  }
              )
            ' \
            current-task-definition.json \
            > new-task-definition.json

          echo "Imagen y variables configuradas para ${CONTAINER_NAME} (solo nombres):"
          jq --arg c "${CONTAINER_NAME}" \
            '.containerDefinitions[] | select(.name == $c) | {image, environment: [.environment[].name]}' \
            new-task-definition.json

      # ----------------------------------------------------------
      # Las credenciales se registran a mano en la task definition.
      # Si falta alguna, se corta aqui (antes de registrar nada) con
      # la lista exacta, en vez de dejar tareas que no arrancan.
      # Acepta la variable en "environment" o como "secrets" (valueFrom).
      # ----------------------------------------------------------
      - name: Verify credentials registered in the task definition
        env:
          SERVICE: ${{ matrix.service }}
          CONTAINER_NAME: ${{ matrix.container-name }}
          TASK_FAMILY: ${{ matrix.task-family }}
          DB_SCHEMA: ${{ matrix.db-schema }}
        run: |
          set -euo pipefail

          REQUIRED=()
          [ -n "${DB_SCHEMA}" ] && REQUIRED+=(SPRING_DATASOURCE_PASSWORD)
          case "${SERVICE}" in
            carrito|orders|recommendation) REQUIRED+=(SPRING_RABBITMQ_PASSWORD) ;;
            notifications) REQUIRED+=(SPRING_RABBITMQ_PASSWORD MAIL_PASSWORD) ;;
            pagos) REQUIRED+=(ANTIFRAUDE_SECRETO_HASH) ;;
            rabbitmq) REQUIRED+=(RABBITMQ_DEFAULT_PASS) ;;
          esac

          if [ "${#REQUIRED[@]}" -eq 0 ]; then
            echo "${SERVICE} no necesita credenciales."
            exit 0
          fi

          MISSING=()
          for name in "${REQUIRED[@]}"; do
            if ! jq -e --arg c "${CONTAINER_NAME}" --arg n "${name}" '
                .containerDefinitions[] | select(.name == $c)
                | ([(.environment // [])[] | select(.name == $n and (.value // "") != "")]
                   + [(.secrets // [])[] | select(.name == $n)]) | length > 0
              ' new-task-definition.json >/dev/null; then
              MISSING+=("${name}")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Faltan credenciales en ${TASK_FAMILY} (contenedor ${CONTAINER_NAME}): ${MISSING[*]}. Registralas en ECS -> Definiciones de tareas -> ${TASK_FAMILY} -> Crear nueva revision -> contenedor ${CONTAINER_NAME} -> Variables de entorno, y vuelve a ejecutar el workflow."
            exit 1
          fi
          echo "Credenciales presentes en ${TASK_FAMILY}: ${REQUIRED[*]}"

      # ----------------------------------------------------------
      # Un broker solo se redespliega si cambio su imagen, su
      # configuracion o su tamano, o si el servicio sigue en 0 tareas.
      # Reiniciarlo en cada push borraria colas y topics (Fargate no
      # guarda disco) sin ninguna necesidad.
      # ----------------------------------------------------------
      - name: Decide whether to deploy
        id: changes
        env:
          KIND: ${{ matrix.kind }}
          ECS_SERVICE: ${{ matrix.ecs-service }}
        run: |
          set -euo pipefail

          if [ "${KIND}" != "broker" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          normalize='{cpu, memory, containerDefinitions: [.containerDefinitions[] | .environment = ((.environment // []) | sort_by(.name))]}'
          CURRENT="$(jq -S -c "${normalize}" current-task-definition.json)"
          NEW="$(jq -S -c "${normalize}" new-task-definition.json)"

          DESIRED="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].desiredCount' \
              --output text
          )"

          if [ "${CURRENT}" = "${NEW}" ] && [ "${DESIRED}" != "0" ]; then
            echo "${ECS_SERVICE} sin cambios (imagen, variables y tamano iguales); no se reinicia."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Register new task definition revision
        id: register
        if: ${{ steps.changes.outputs.deploy == 'true' }}
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://new-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          rm -f current-task-definition.json new-task-definition.json

          echo "Registered: ${TASK_DEFINITION_ARN}"
          echo "arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      # ----------------------------------------------------------
      # Terraform crea los servicios con desired_count = 0, por eso
      # se fija aqui (por defecto 1). Requiere en cada aws_ecs_service:
      #   lifecycle { ignore_changes = [task_definition, desired_count] }
      #
      # Circuit breaker con rollback: si las tareas nuevas no arrancan,
      # ECS vuelve a la revision anterior en vez de reintentar sin fin
      # (lo que consume presupuesto del lab).
      # ----------------------------------------------------------
      - name: Deploy task definition to ECS service
        if: ${{ steps.changes.outputs.deploy == 'true' }}
        env:
          KIND: ${{ matrix.kind }}
          ECS_SERVICE: ${{ matrix.ecs-service }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
          DESIRED_COUNT: ${{ inputs.desired_count || '1' }}
        run: |
          set -euo pipefail

          if ! [[ "${DESIRED_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::desired_count debe ser un entero mayor a 0 (recibido: ${DESIRED_COUNT})."
            exit 1
          fi

          if [ "${KIND}" = "broker" ]; then
            # Un solo broker, y nunca dos a la vez: se detiene el viejo antes de
            # arrancar el nuevo (dos nodos Kafka con el mismo id romperian el cluster).
            DESIRED_COUNT=1
            DEPLOYMENT="deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=100,minimumHealthyPercent=0"
          else
            DEPLOYMENT="deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100"
          fi

          ARGS=(
            --cluster "${ECS_CLUSTER}"
            --service "${ECS_SERVICE}"
            --task-definition "${TASK_DEFINITION_ARN}"
            --desired-count "${DESIRED_COUNT}"
            --deployment-configuration "${DEPLOYMENT}"
            --force-new-deployment
          )

          # El grace period solo es valido en servicios con load balancer.
          LB_COUNT="$(
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'length(services[0].loadBalancers)' \
              --output text
          )"

          if [ "${LB_COUNT}" != "0" ]; then
            ARGS+=(--health-check-grace-period-seconds 180)
          fi

          aws ecs update-service "${ARGS[@]}" >/dev/null

          echo "Deployment started: ${ECS_SERVICE} -> ${TASK_DEFINITION_ARN} (desired=${DESIRED_COUNT})"

      # ----------------------------------------------------------
      # Espera el rollout real (no solo "services-stable"): termina
      # en cuanto ECS marca COMPLETED, o falla de inmediato si el
      # circuit breaker lo marca FAILED o hizo rollback.
      # ----------------------------------------------------------
      - name: Wait for rollout
        if: ${{ steps.changes.outputs.deploy == 'true' }}
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
        run: |
          set -euo pipefail

          DEADLINE=$((SECONDS + 25 * 60))

          while (( SECONDS < DEADLINE )); do
            read -r PRIMARY_TD ROLLOUT RUNNING DESIRED < <(
              aws ecs describe-services \
                --cluster "${ECS_CLUSTER}" \
                --services "${ECS_SERVICE}" \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState, runningCount, desiredCount]' \
                --output text
            )

            echo "$(date -u +%H:%M:%S) rollout=${ROLLOUT} running=${RUNNING}/${DESIRED}"

            if [ "${PRIMARY_TD}" != "${TASK_DEFINITION_ARN}" ]; then
              echo "::error::ECS hizo rollback de ${ECS_SERVICE} a ${PRIMARY_TD}."
              exit 1
            fi

            case "${ROLLOUT}" in
              COMPLETED)
                echo "${ECS_SERVICE} desplegado correctamente."
                exit 0
                ;;
              FAILED)
                echo "::error::El circuit breaker marco el despliegue de ${ECS_SERVICE} como FAILED."
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::${ECS_SERVICE} no termino el rollout en 25 minutos."
          exit 1

      # ----------------------------------------------------------
      # recommendation y analytics no se dan por desplegados si sus
      # tablas de DynamoDB no existen (y, en analytics, si la tabla de
      # productos no tiene el stream que alimenta la telemetria).
      # Las crea el propio servicio al arrancar con LabRole; si un
      # permiso o la region fallan, el deploy falla aqui y no en silencio.
      # ----------------------------------------------------------
      - name: Verify DynamoDB tables
        if: ${{ matrix.service == 'recommendation' || matrix.service == 'analytics' }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          if [ "${SERVICE}" = "recommendation" ]; then
            TABLES=(UserInteractions)
          else
            TABLES=(camisetas360-analytics-eventos camisetas360-analytics-productos camisetas360-analytics-recomendaciones)
          fi

          for table in "${TABLES[@]}"; do
            STATUS=""
            for _ in $(seq 1 20); do
              STATUS="$(aws dynamodb describe-table --table-name "${table}" \
                --query 'Table.TableStatus' --output text 2>/dev/null || true)"
              [ "${STATUS}" = "ACTIVE" ] && break
              sleep 15
            done
            if [ "${STATUS}" != "ACTIVE" ]; then
              echo "::error::La tabla DynamoDB ${table} no existe o no esta ACTIVE (estado: ${STATUS:-no existe}). Revisa /ecs/${SERVICE} en CloudWatch."
              exit 1
            fi
            echo "DynamoDB ${table}: ACTIVE"
          done

          if [ "${SERVICE}" = "analytics" ]; then
            read -r ENABLED VIEW < <(aws dynamodb describe-table --table-name camisetas360-analytics-productos \
              --query 'Table.StreamSpecification.[StreamEnabled,StreamViewType]' --output text)
            if [ "${ENABLED}" != "True" ] || { [ "${VIEW}" != "NEW_IMAGE" ] && [ "${VIEW}" != "NEW_AND_OLD_IMAGES" ]; }; then
              echo "::error::camisetas360-analytics-productos no tiene DynamoDB Streams con imagen nueva (${ENABLED}/${VIEW}): la telemetria WebSocket no recibiria datos."
              exit 1
            fi
            echo "DynamoDB Streams en camisetas360-analytics-productos: ${VIEW}"
          fi

      - name: Show diagnostics
        if: ${{ failure() }}
        env:
          ECS_SERVICE: ${{ matrix.ecs-service }}
          SERVICE: ${{ matrix.service }}
        run: |
          set +e

          echo "--- Ultimos eventos del servicio ---"
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].events[:10].message' \
            --output json

          echo "--- Tareas detenidas recientemente ---"
          STOPPED="$(
            aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --query 'taskArns[:3]' \
              --output text
          )"

          if [ -n "${STOPPED}" ] && [ "${STOPPED}" != "None" ]; then
            # shellcheck disable=SC2086
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${STOPPED} \
              --query 'tasks[].{Reason:stoppedReason,Containers:containers[].{Name:name,Reason:reason,ExitCode:exitCode}}' \
              --output json
          fi

          echo "--- Ultimos logs (/ecs/${SERVICE}) ---"
          aws logs tail "/ecs/${SERVICE}" --since 15m --format short 2>/dev/null | tail -n 80

  # ============================================================
  # 4. Final deployment gate
  # ============================================================
  deployment-gate:
    name: Backend deployment successful
    needs:
      - preflight
      - tests
      - provision
      - build-images
      - deploy-services

    if: ${{ always() }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require complete deployment success
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          DEPLOY_RESULT: ${{ needs.deploy-services.result }}
        run: |
          set -euo pipefail

          echo "Preflight: ${PREFLIGHT_RESULT}"
          echo "Tests:     ${TESTS_RESULT}"
          echo "Provision: ${PROVISION_RESULT}"
          echo "Build:     ${BUILD_RESULT}"
          echo "Deploy:    ${DEPLOY_RESULT}"

          test "${PREFLIGHT_RESULT}" = "success"
          test "${TESTS_RESULT}" = "success"
          test "${PROVISION_RESULT}" = "success"
          test "${BUILD_RESULT}" = "success"
          test "${DEPLOY_RESULT}" = "success"

      - name: Write deployment summary
        env:
          SERVICES: ${{ needs.preflight.outputs.services }}
          NLB_DNS: ${{ needs.provision.outputs.nlb_dns }}
          DB_ENDPOINT: ${{ needs.provision.outputs.db_endpoint }}
        run: |
          {
            echo "## Camisetas360 Backend Deployment"
            echo
            echo "- Environment: production"
            echo "- AWS region: ${AWS_REGION}"
            echo "- ECS cluster: ${ECS_CLUSTER} (Fargate)"
            echo "- NLB interno: \`${NLB_DNS}\` (usalo en las integraciones del API Gateway)"
            echo "- Aurora: \`${DB_ENDPOINT}\`"
            echo "- Git commit: \`${GITHUB_SHA}\`"
            echo
            echo "| Servicio | Tipo | Puerto NLB | Schema Aurora | Tarea |"
            echo "|---|---|---|---|---|"
            jq -r '.include[] | "| \(.service) | \(.kind) | \(.port) | \(if .kind == "broker" then "-" elif .["db-schema"] == "" then "DynamoDB" else .["db-schema"] end) | \(if .cpu == "" then "segun task definition" else "\(.cpu) CPU / \(.memory) MB" end) |"' <<< "${SERVICES}"
          } >> "${GITHUB_STEP_SUMMARY}"
